name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64-v8a
            platform: android-arm64
          - arch: armeabi-v7a
            platform: android-arm
          - arch: x86_64
            platform: android-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
          cache: true

      - name: Setup signing
        run: |
          {
            echo "storePassword=123456"
            echo "keyPassword=123456"
            echo "keyAlias=pichoro"
            echo "storeFile=release-key.jks"
          } > "$GITHUB_WORKSPACE/android/key.properties"

      - name: Install dependencies
        run: flutter pub get

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release --target-platform ${{ matrix.platform }} --split-per-abi --no-tree-shake-icons

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-${{ matrix.arch }}-release.apk \
             build/app/outputs/flutter-apk/PicHoro-v${{ steps.version.outputs.version }}-${{ matrix.arch }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicHoro-${{ matrix.arch }}
          path: build/app/outputs/flutter-apk/PicHoro-v${{ steps.version.outputs.version }}-${{ matrix.arch }}.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks/
          merge-multiple: true

      - name: Check if release already exists
        id: check_release
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo ${{ github.repository }} &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PicHoro v${{ steps.version.outputs.version }}
          body: |
            ## PicHoro v${{ steps.version.outputs.version }}

            ### 安装说明
            - **arm64-v8a**: 大多数现代 Android 手机（2017年后）
            - **armeabi-v7a**: 较旧的 32 位设备
            - **x86_64**: 模拟器 / 平板

            如果不确定选哪个，下载 **arm64-v8a** 版本。
          files: apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip release (already exists)
        if: steps.check_release.outputs.exists == 'true'
        run: echo "Release v${{ steps.version.outputs.version }} already exists, skipping."
